name: CTF WeakMap UAF probe

on:
  pull_request:
    paths:
      - .github/workflows/ctf-weakmap-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-asan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download latest Linux ASan builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser shell

          curl --fail --location --retry 4 --retry-delay 3 \
            'https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.v2.mozilla-central.latest.firefox.linux64-asan-opt/artifacts/public/build/target.tar.xz' \
            --output browser/firefox-asan-opt.tar.xz

          curl --fail --location --retry 4 --retry-delay 3 \
            'https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.v2.mozilla-central.latest.firefox.sm-linux64-asan-opt/artifacts/public/build/target.jsshell.zip' \
            --output shell/jsshell-asan-opt.zip

          sha256sum browser/* > browser/SHA256SUMS
          sha256sum shell/* > shell/SHA256SUMS
          du -h browser/* shell/*

      - name: Upload Firefox ASan browser
        uses: actions/upload-artifact@v4
        with:
          name: firefox-asan-browser
          path: browser/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload SpiderMonkey ASan shell
        uses: actions/upload-artifact@v4
        with:
          name: jsshell-asan
          path: shell/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
