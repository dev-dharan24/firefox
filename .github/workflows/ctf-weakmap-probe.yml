name: CTF WeakMap UAF probe

on:
  pull_request:
    paths:
      - .github/workflows/ctf-weakmap-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-asan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download latest Linux ASan builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          curl --fail --location --retry 4 --retry-delay 3 \
            'https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.v2.mozilla-central.latest.firefox.linux64-asan-opt/artifacts/public/build/target.tar.xz' \
            --output artifacts/firefox-asan-opt.tar.xz

          # The matching SpiderMonkey shell is useful for deterministic GC-state
          # experiments before the browser-level trigger is run locally.
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.v2.mozilla-central.latest.firefox.sm-linux64-asan-opt/artifacts/public/build/target.jsshell.zip' \
            --output artifacts/jsshell-asan-opt.zip

          sha256sum artifacts/* | tee artifacts/SHA256SUMS
          du -h artifacts/*

      - name: Upload ASan prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: firefox-asan-latest
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
