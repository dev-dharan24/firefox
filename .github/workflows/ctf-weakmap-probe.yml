name: CTF WeakMap UAF probe

on:
  pull_request:
    paths:
      - .github/workflows/ctf-weakmap-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-debug-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download latest Linux ASan debug SpiderMonkey shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shell
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.v2.mozilla-central.latest.firefox.sm-linux64-asan-debug/artifacts/public/build/target.jsshell.zip' \
            --output shell/jsshell-asan-debug.zip
          sha256sum shell/* > shell/SHA256SUMS
          du -h shell/*

      - name: Upload SpiderMonkey ASan debug shell
        uses: actions/upload-artifact@v4
        with:
          name: jsshell-asan-debug
          path: shell/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
