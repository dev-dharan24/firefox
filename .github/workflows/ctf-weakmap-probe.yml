name: CTF WeakMap UAF probe

on:
  pull_request:
    paths:
      - .github/workflows/ctf-weakmap-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-debug-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest Linux ASan debug SpiderMonkey shell
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade fuzzfetch
          mkdir -p shell
          fuzzfetch --target js --branch central --build latest \
            --asan --debug --out shell/runtime
          find shell/runtime -maxdepth 3 -type f -printf '%p %s\n' | sort
          tar -C shell/runtime -cJf shell/jsshell-asan-debug.tar.xz .
          rm -rf shell/runtime
          sha256sum shell/jsshell-asan-debug.tar.xz > shell/SHA256SUMS
          du -h shell/*

      - name: Upload SpiderMonkey ASan debug shell
        uses: actions/upload-artifact@v4
        with:
          name: jsshell-asan-debug
          path: shell/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
